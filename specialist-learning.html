<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My Specialist Course | Flat Out Built-Up Roofing</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="interior-preview-four.css"><style>body{background:#090909;color:#f8ecd2;font:16px/1.65 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}a{color:#f7d27e}h1,h2,h3{color:#efcd83}article,fieldset,.panel{border:1px solid #987546;border-radius:12px;background:#16130f;padding:20px;margin:18px 0}label{display:block;margin:10px 0}select,button{max-width:100%;padding:10px;border-radius:6px;font:inherit}button{background:#d8af5b;color:#100a02;font-weight:bold}img{display:block;width:100%;height:auto;max-height:360px;object-fit:contain} [hidden]{display:none!important} .muted{color:#b9af9e}</style></head><body><main><nav><a href="index.html">Home</a> · <a href="members.html">My Learning</a> · <a href="specialist-courses.html">Specialist catalogue</a></nav><h1>My specialist courses</h1><p>Sign in and choose an individually purchased course. Access is verified by the server. Unreleased training cannot be opened.</p><form id="selectCourse"><label for="course">Course</label><select id="course" required><option value="">Choose course</option><option value="bu-01">Built-Up Roofing — Built-up membrane systems and specification</option><option value="bu-02">Built-Up Roofing — Decks, substrates and moisture investigation</option><option value="bu-03">Built-Up Roofing — Tapered insulation and falls planning</option><option value="bu-04">Built-Up Roofing — Vapour control, insulation and interfaces</option><option value="bu-05">Built-Up Roofing — Outlets, upstands and flashing review</option><option value="bu-06">Built-Up Roofing — Quality, hot-work awareness and handover</option><option value="ts-01">Tile &amp; Slate Roofing — Roof geometry, pitch and setting-out</option><option value="ts-02">Tile &amp; Slate Roofing — Underlays, ventilation and battens</option><option value="ts-03">Tile &amp; Slate Roofing — Tile and slate systems, fixing design</option><option value="ts-04">Tile &amp; Slate Roofing — Ridges, hips, valleys and flashings</option><option value="ts-05">Tile &amp; Slate Roofing — Roof openings, abutments and weatherproof interfaces</option><option value="ts-06">Tile &amp; Slate Roofing — Inspection, maintenance and safe handover</option><option value="ms-01">Metal &amp; Sheet Roofing — Sheet profiles and system selection</option><option value="ms-02">Metal &amp; Sheet Roofing — Supports, fixing schedules and standing seams</option><option value="ms-03">Metal &amp; Sheet Roofing — Weatherproofing, seals and interfaces</option><option value="ms-04">Metal &amp; Sheet Roofing — Insulation, condensation and thermal design</option><option value="ms-05">Metal &amp; Sheet Roofing — Handling, fragile surfaces and safe installation awareness</option><option value="ms-06">Metal &amp; Sheet Roofing — Inspection, coatings and maintenance</option><option value="la-01">Liquid Applied Roofing Systems — Liquid system selection and design</option><option value="la-02">Liquid Applied Roofing Systems — Substrate assessment and preparation acceptance</option><option value="la-03">Liquid Applied Roofing Systems — Primers, adhesion and material compatibility</option><option value="la-04">Liquid Applied Roofing Systems — Reinforcement and junction detailing</option><option value="la-05">Liquid Applied Roofing Systems — Application conditions, coverage and cure review</option><option value="la-06">Liquid Applied Roofing Systems — Inspection, curing, maintenance and handover</option></select><button type="submit">Open my course</button></form><p id="status" role="status" aria-live="polite">Checking sign-in…</p><section id="lesson" hidden></section></main><script type="module">
import {supabase,requireUser} from './auth.js';
const status=document.querySelector('#status'),lesson=document.querySelector('#lesson'),form=document.querySelector('#selectCourse'),select=document.querySelector('#course');
let requestNumber=0;
const create=(tag,text)=>{const el=document.createElement(tag);el.textContent=text;return el};
const existing=new URLSearchParams(location.search).get('course');if(existing&&[...select.options].some(x=>x.value===existing))select.value=existing;
function clear(){lesson.hidden=true;lesson.replaceChildren()}
function render(c){clear();lesson.append(create('h2',c.title),create('p',c.objective),create('p','Training and revision only. Follow competent supervision, the approved design and system-specific instructions.'));
const illustrations={bu:'assets/training-3d/felt-roof-assembly.webp',ts:'assets/training-3d/tile-and-slate.webp',ms:'assets/training-3d/standing-seam-metal.webp',la:'assets/liquid-applied-roof-cutaway.svg'};const fig=document.createElement('figure'),img=document.createElement('img');img.src=illustrations[c.id.slice(0,2)];img.alt='Illustrative roof assembly; not an installation specification.';fig.append(img,create('figcaption','Concept illustration — not a technical specification.'));lesson.append(fig);
for(const s of c.sections){const a=document.createElement('article');a.append(create('h3',s.heading),create('p',s.body));lesson.append(a)}
const exercise=document.createElement('article');exercise.append(create('h3','Apply your learning'),create('p',c.exercise));lesson.append(exercise);
const quiz=document.createElement('form');quiz.append(create('h2','Knowledge check'));
c.assessment.forEach((q,i)=>{const field=document.createElement('fieldset');field.append(create('legend',q.question));q.options.forEach((o,j)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=String(j);input.required=true;label.append(input,document.createTextNode(' '+o));field.append(label)});quiz.append(field)});
const submit=create('button','Check answers');submit.type='submit';const result=create('p','');result.setAttribute('role','status');quiz.append(submit,result);
quiz.addEventListener('submit',event=>{event.preventDefault();const answers=new FormData(quiz);const score=c.assessment.filter((q,i)=>Number(answers.get('q'+i))===q.correct).length;result.textContent='Score '+score+'/'+c.assessment.length+'. '+(score===c.assessment.length?'All correct.':'Review the learning sections and try again.');});lesson.append(quiz);
const refs=document.createElement('article');refs.append(create('h3','Free official reference material'));for(const [name,url] of c.references){const a=create('a',name);a.href=url;a.target='_blank';a.rel='noopener noreferrer';const p=document.createElement('p');p.append(a);refs.append(p)}lesson.append(refs);lesson.hidden=false;}
const user=await requireUser('specialist-learning.html');if(user){status.textContent='Choose an individually purchased course.';form.addEventListener('submit',async event=>{event.preventDefault();clear();const id=select.value,request=++requestNumber;status.textContent='Verifying your individual course access…';try{const {data,error}=await supabase.auth.getSession();if(error||!data.session)throw Error('Please sign in again.');const r=await fetch('https://fhyhshakmvqwzdyannec.supabase.co/functions/v1/specialist-course-content?course='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+data.session.access_token,apikey:'sb_publishable_U5QORbnSzGR4j1_8hrmCGg_GOeQ5jwu'},cache:'no-store'});const body=await r.json();if(request!==requestNumber)return;if(!r.ok||body.entitled!==true||body.course?.id!==id)throw Error(body.error||'Course access unavailable.');render(body.course);status.textContent='Course access verified.'}catch(e){if(request===requestNumber)status.textContent=e.message}})}
supabase.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){requestNumber++;clear();location.replace('login.html')}});
</script></body></html>
