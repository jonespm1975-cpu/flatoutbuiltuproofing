function renderDiagram(d){

function studyPlan(c){const a=document.createElement('article');a.append(create('h3','Study plan — approximately '+c.estimated_minutes+' minutes'),create('p','Suggested active-learning time, not an accredited duration.'));const ol=document.createElement('ol');for(const [task,minutes] of c.study_plan)ol.append(create('li',task+' — '+minutes+' min'));a.append(ol);return a;}
