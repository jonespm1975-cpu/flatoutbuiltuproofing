<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative roof fall and rainwater outlet</title>
  <desc id="desc">An isometric roof plane slopes gently toward a rainwater outlet. Flow lines show the intended direction only; actual falls, outlet capacity and overflow design vary by project.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171716"/><stop offset="1" stop-color="#0b0b0a"/></linearGradient><linearGradient id="roof" x2="0" y2="1"><stop stop-color="#6c665b"/><stop offset="1" stop-color="#343330"/></linearGradient><linearGradient id="edge" x2="0" y2="1"><stop stop-color="#bca26e"/><stop offset="1" stop-color="#59472c"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#b9dcde"/><stop offset="1" stop-color="#548d99"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="14"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#b8d6d7" stroke-width="2"/></marker></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/><rect x="1.5" y="1.5" width="1197" height="617" rx="27" fill="none" stroke="#987746" stroke-opacity=".65" stroke-width="3"/><text x="58" y="44" fill="#e4c783" font-family="Arial,sans-serif" font-size="18" letter-spacing="4">ROOF DRAINAGE · FALLS AND OUTLETS</text>
  <ellipse cx="515" cy="500" rx="430" ry="44" fill="#000" opacity=".5" filter="url(#shadow)"/>
  <!-- roof plane -->
  <path d="M125 203 708 112 1042 226 451 358Z" fill="url(#roof)" stroke="#dbbc78" stroke-width="4"/>
  <path d="M125 203 451 358 451 403 125 246Z" fill="#242321" stroke="#8b7042" stroke-width="2"/><path d="M451 358 1042 226 1042 271 451 403Z" fill="url(#edge)" stroke="#8b7042" stroke-width="2"/>
  <path d="M171 211 707 132 990 229" fill="none" stroke="#eee0c1" stroke-opacity=".14" stroke-width="2"/>
  <!-- drain and outlet pipe -->
  <ellipse cx="889" cy="260" rx="76" ry="28" transform="rotate(-12 889 260)" fill="#131313" stroke="#c6a35e" stroke-width="5"/><ellipse cx="889" cy="260" rx="39" ry="13" transform="rotate(-12 889 260)" fill="#070707" stroke="#8d7448" stroke-width="3"/>
  <path d="M863 268 863 401Q864 421 886 422H964" fill="none" stroke="#a9cbd0" stroke-width="18" stroke-linecap="round"/><path d="M863 268 863 397Q864 411 886 412H964" fill="none" stroke="url(#water)" stroke-width="8" stroke-linecap="round"/>
  <!-- flowing water paths -->
  <g fill="none" stroke="#b8d6d7" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" opacity=".9"><path d="M300 209 490 232 674 251"/><path d="M475 167 620 188 758 215"/><path d="M645 294 746 280 820 268"/></g>
  <g fill="#d4c091" opacity=".85"><circle cx="346" cy="222" r="4"/><circle cx="395" cy="228" r="3"/><circle cx="565" cy="186" r="3"/><circle cx="686" cy="290" r="4"/><circle cx="776" cy="268" r="3"/></g>
  <!-- callouts -->
  <g font-family="Arial,sans-serif"><text x="74" y="132" fill="#f1dfb9" font-size="23" font-weight="700">Higher area</text><path d="M190 139 258 191" stroke="#e6c47c" stroke-width="2"/><circle cx="258" cy="191" r="5" fill="#efd28e"/>
  <text x="795" y="122" fill="#f1dfb9" font-size="23" font-weight="700">Designed outlet</text><path d="M885 132 887 224" stroke="#e6c47c" stroke-width="2"/><circle cx="887" cy="224" r="5" fill="#efd28e"/>
  <text x="957" y="443" fill="#f1dfb9" font-size="21" font-weight="700">Rainwater route</text><path d="M951 423 929 412" stroke="#e6c47c" stroke-width="2"/></g>
  <path d="M58 515h1084" stroke="#987746" stroke-opacity=".45"/><text x="58" y="554" fill="#c7baa0" font-family="Arial,sans-serif" font-size="17">Illustrative only · Falls, outlet capacity, secondary drainage and overflow provisions require project-specific design.</text>
</svg>
