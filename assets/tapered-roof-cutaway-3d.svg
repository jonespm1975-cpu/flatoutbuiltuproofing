<!-- the VCL always remains visible, as it is checked at stage one -->
<polygon points="232,452 852,489 1029,330 407,293" fill="#d1d5d8" stroke="#ffc879" stroke-width="4"/>
<path d="M238 451L851 488L1024 335" fill="none" stroke="#ffcc72" stroke-width="6" opacity=".95"/>
<!-- the tapered board layer is independently stage-controlled by the existing JS -->
<g id="board" class="animboard" opacity=".18" transform="translate(0,-36)">
<polygon points="234,385 852,429 1022,278 403,235" fill="url(#goldfoam)" stroke="#fff0c0" stroke-width="4"/>
<polygon points="234,385 852,429 852,483 234,444" fill="url(#edgefoam)" stroke="#f7dba9" stroke-width="3"/>
<polygon points="852,429 1022,278 1022,334 852,483" fill="#a98755" stroke="#e9c69a" stroke-width="3"/>
<path d="M330 393l170 -153" stroke="#fff2d2" stroke-opacity=".6" stroke-width="2"/><path d="M330 393v55" stroke="#956e41" stroke-width="2"/><path d="M435 400l170 -153" stroke="#fff2d2" stroke-opacity=".6" stroke-width="2"/><path d="M435 400v55" stroke="#956e41" stroke-width="2"/><path d="M540 407l170 -153" stroke="#fff2d2" stroke-opacity=".6" stroke-width="2"/><path d="M540 407v55" stroke="#956e41" stroke-width="2"/><path d="M645 414l170 -153" stroke="#fff2d2" stroke-opacity=".6" stroke-width="2"/><path d="M645 414v55" stroke="#956e41" stroke-width="2"/><path d="M750 421l170 -153" stroke="#fff2d2" stroke-opacity=".6" stroke-width="2"/><path d="M750 421v55" stroke="#956e41" stroke-width="2"/>
<path d="M238 387L851 430L1021 279" fill="none" stroke="#fff7e1" stroke-width="5" opacity=".8"/>
</g>
<!-- compatible waterproofing: stage 3 reveals this layer -->
<g id="membrane" opacity="0"><polygon points="235,350 855,395 1021,247 403,207" fill="url(#cover)" stroke="#aeb5b9" stroke-width="4"/>
<polygon points="235,350 855,395 855,421 235,376" fill="#242a2f" stroke="#6d777b" stroke-width="3"/>
<polygon points="855,395 1021,247 1021,271 855,421" fill="#1b2227" stroke="#717a7c" stroke-width="3"/>
