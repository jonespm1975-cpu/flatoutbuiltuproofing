<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">Illustrated three-dimensional tapered-insulation roof cutaway</title>
<desc id="desc">Conceptual exploded perspective showing a brick upstand, built-up waterproofing, tapered insulation board wedges, vapour control layer and profiled steel roof deck, with a roof outlet at the low point. Educational schematic, not to scale.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#202023"/><stop offset=".55" stop-color="#090a0c"/><stop offset="1" stop-color="#151008"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#b7853d" stop-opacity=".24"/><stop offset="1" stop-color="#0a0b0d" stop-opacity="0"/></radialGradient>
<linearGradient id="steel" x2=".2" y2="1"><stop stop-color="#ccd2d5"/><stop offset=".4" stop-color="#7e8c95"/><stop offset=".75" stop-color="#4b565f"/><stop offset="1" stop-color="#18222b"/></linearGradient>
<linearGradient id="goldfoam" x1=".1" x2=".8" y2="1"><stop stop-color="#fff1cb"/><stop offset=".3" stop-color="#f1ddb4"/><stop offset=".72" stop-color="#d9b77f"/><stop offset="1" stop-color="#bc9760"/></linearGradient>
<linearGradient id="edgefoam" x1="0" x2=".9" y2="1"><stop stop-color="#f7dcb1"/><stop offset=".65" stop-color="#d6b27c"/><stop offset="1" stop-color="#a77d44"/></linearGradient>
<linearGradient id="cover" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#6b7075"/><stop offset=".4" stop-color="#3a3e43"/><stop offset="1" stop-color="#171b20"/></linearGradient>
<pattern id="grit" width="14" height="13" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#f6f6f6" opacity=".13"/><circle cx="9" cy="10" r=".8" fill="#e0e0e0" opacity=".11"/></pattern>
<pattern id="brick" width="80" height="28" patternUnits="userSpaceOnUse"><path d="M0 0H80 M0 27H80 M40 0V27" stroke="#f5c6a2" stroke-width="2" opacity=".3"/></pattern>
<filter id="shadow" x="-25%" y="-35%" width="155%" height="175%"><feDropShadow dx="0" dy="17" stdDeviation="15" flood-color="#000" flood-opacity=".85"/></filter>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#42d4ef"/></marker>
</defs>
<rect width="1120" height="690" rx="16" fill="url(#bg)"/><ellipse cx="720" cy="355" rx="540" ry="310" fill="url(#halo)"/>
<path d="M0 614H1120" stroke="#c9984f" opacity=".35" stroke-width="2"/>
