<path d="M410 222L410 359 M550 231L550 366 M688 243L688 377 M827 251L827 389" stroke="#868f96" stroke-width="3" opacity=".45"/>
<path d="M238 351L854 395L1021 248" stroke="#d6dfe1" stroke-width="3" opacity=".8"/></g>
<!-- gutter / designed outlet and directional arrows stage 4 -->
<g id="drain" opacity="0"><ellipse cx="805" cy="330" rx="42" ry="15" fill="#12161a" stroke="#d4dce2" stroke-width="6"/>
