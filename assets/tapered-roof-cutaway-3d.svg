<path d="M846 126L805 278" stroke="#f3cc78" stroke-width="3"/>
<text x="40" y="565" font-size="26">Profiled steel deck</text>
<path d="M298 547L430 506" stroke="#f3cc78" stroke-width="3"/><circle cx="430" cy="506" r="6" fill="#ffc560"/>
<text x="40" y="616" font-size="25">Vapour control layer (VCL)</text>
<path d="M405 598L526 468" stroke="#f3cc78" stroke-width="3"/><circle cx="526" cy="468" r="6" fill="#ffc560"/>
<text x="708" y="623" font-size="24">Tapered insulation boards</text>
<path d="M851 593L804 447" stroke="#f3cc78" stroke-width="3"/><circle cx="804" cy="447" r="6" fill="#ffc560"/>
</g>
<text x="558" y="666" text-anchor="middle" font="20px Arial,sans-serif" fill="#c7b797">Illustrative concept only · Not a construction drawing or approved specification</text>
</svg>