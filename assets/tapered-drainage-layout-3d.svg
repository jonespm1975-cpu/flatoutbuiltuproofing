<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">Three-dimensional tapered insulation board layout and roof drainage plan</title>
<desc id="desc">A conceptual top-down perspective showing tapered and level insulation board zones draining toward two central low point outlets, with cyan water flow arrows. The layout is illustrative, not a project-specific schedule.</desc>
<defs>
<linearGradient id="back" x2=".8" y2="1"><stop stop-color="#24211a"/><stop offset=".57" stop-color="#0c0d0e"/><stop offset="1" stop-color="#191009"/></linearGradient>
<linearGradient id="level" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfc2c3"/><stop offset=".45" stop-color="#929fa5"/><stop offset="1" stop-color="#646c77"/></linearGradient>
<linearGradient id="slope" x1=".2" y1="0" x2=".9" y2="1"><stop stop-color="#fff0d4"/><stop offset=".45" stop-color="#e0ca9d"/><stop offset="1" stop-color="#c7a978"/></linearGradient>
<linearGradient id="deck" x2=".3" y2="1"><stop stop-color="#84939e"/><stop offset=".7" stop-color="#3a424a"/><stop offset="1" stop-color="#141b24"/></linearGradient>
<pattern id="fine" width="20" height="19" patternUnits="userSpaceOnUse"><path d="M0 18L20 0" stroke="#fff" stroke-opacity=".05" stroke-width="1"/></pattern>
<filter id="shade" x="-10%" y="-15%" width="130%" height="160%"><feDropShadow dx="2" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".75"/></filter>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M0 1L13 7L0 13Z" fill="#35d3f6"/></marker>
<clipPath id="roofcut"><polygon points="140,135 980,135 1040,553 80,553"/></clipPath>
</defs>
<rect width="1120" height="740" rx="16" fill="url(#back)"/>
<text x="48" y="60" fill="#f2d291" font="bold 30px Georgia,serif">TAPERED BOARD LAYOUT · DRAINAGE PLAN</text>
<g filter="url(#shade)">
<!-- profile depth below the roof plan -->
<polygon points="80,553 1040,553 1040,595 80,595" fill="url(#deck)" stroke="#e2d0a8" stroke-width="3"/>
<polygon points="140,135 980,135 1040,553 80,553" fill="#a3a8ab" stroke="#ecdcbb" stroke-width="6"/>
<!-- high area and progressive tapered fields -->
<g clip-path="url(#roofcut)" stroke="#d7c9af" stroke-width="3">
<polygon points="130,135 485,135 540,280 104,280" fill="url(#level)"/>
<polygon points="595,135 990,135 1005,280 540,280" fill="url(#level)"/>
<polygon points="100,280 540,280 540,398 90,398" fill="url(#slope)"/>
<polygon points="540,280 1006,280 1021,398 540,398" fill="url(#slope)"/>
<polygon points="90,398 540,398 540,475 84,475" fill="url(#slope)"/>
<polygon points="540,398 1021,398 1030,475 540,475" fill="url(#slope)"/>
<polygon points="84,475 540,475 540,567 80,567" fill="url(#level)"/>
<polygon points="540,475 1030,475 1041,567 540,567" fill="url(#level)"/>
</g>
<!-- visible board joints / diagonal crickets -->
<g clip-path="url(#roofcut)" fill="none" stroke="#666359" stroke-width="2.7" opacity=".69">
<path d="M290 130L238 550M475 130L456 550M660 130L681 550M840 130L888 550"/>
<path d="M117 218H999M96 336H1020M86 439H1030M140 135L540 300L980 135M80 553L540 469L1040 553"/>
<path d="M290 215L390 280 M730 280L830 215 M225 475L326 399 M754 398L855 475"/>
</g>
<polygon points="140,135 980,135 1040,553 80,553" fill="url(#fine)" opacity=".6"/>
<path d="M140 135L980 135L1040 553L80 553Z" fill="none" stroke="#fbe7b5" stroke-width="7"/>
<!-- parapet lip -->
<path d="M140 135L980 135 M80 553L1040 553" stroke="#d7d7d5" stroke-width="13" stroke-linecap="round" opacity=".9"/>
<!-- outlet sumps, shown as realistic metal drain caps -->
<g>
<ellipse cx="540" cy="297" rx="33" ry="25" fill="#161b20" stroke="#e4d3a9" stroke-width="6"/>
<ellipse cx="540" cy="297" rx="22" ry="16" fill="#8c989d" stroke="#282d30" stroke-width="5"/>
<ellipse cx="540" cy="297" rx="12" ry="9" fill="#131d25"/>
<path d="M524 289l32 16M524 305l32-16M540 279v36" stroke="#282c31" stroke-width="3"/>
<ellipse cx="540" cy="476" rx="35" ry="25" fill="#151b1e" stroke="#e4d3a9" stroke-width="6"/>
<ellipse cx="540" cy="476" rx="22" ry="16" fill="#8b979b" stroke="#282b30" stroke-width="5"/>
<ellipse cx="540" cy="476" rx="12" ry="9" fill="#151d23"/>
<path d="M524 469l32 16M524 485l32-16M540 457v36" stroke="#272c30" stroke-width="3"/>
</g>
<!-- water-flow arrows do not change the physical technical drawing -->
<g stroke="#40d5f3" stroke-width="9" stroke-linecap="round" fill="none" marker-end="url(#arrow)">
<path d="M322 227L487 279"/>
<path d="M758 227L591 279"/>
<path d="M308 375L484 322"/>
<path d="M770 375L591 322"/>
<path d="M330 508L491 484"/>
<path d="M758 508L589 484"/>
<path d="M539 175V246"/>
<path d="M540 359V428"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-weight="850" fill="#f9f4e8">
<text x="230" y="191" font-size="28">HIGH ZONE</text><text x="757" y="191" font-size="28">HIGH ZONE</text>
<text x="195" y="536" font-size="28">HIGH ZONE</text><text x="773" y="536" font-size="28">HIGH ZONE</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-weight="850" font-size="25">
<rect x="164" y="340" width="100" height="39" rx="3" fill="#1168aa" stroke="#5bd8fb" stroke-width="2"/><text x="184" y="369" fill="white">FALL</text>
<rect x="820" y="340" width="100" height="39" rx="3" fill="#1168aa" stroke="#5bd8fb" stroke-width="2"/><text x="840" y="369" fill="white">FALL</text>
</g>
</g>
<!-- high contrast responsive key, repeats same terms in HTML adjacent to image -->
<rect x="27" y="621" width="1066" height="91" rx="8" fill="#0e0f11" stroke="#d7ad5a" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#f2e9d7">
<rect x="47" y="644" width="46" height="29" fill="#e5cb9b" stroke="#fff3d7" stroke-width="2"/><text x="105" y="657">Tapered</text><text x="105" y="683">insulation boards</text>
<rect x="317" y="644" width="46" height="29" fill="#a1a8ae" stroke="#d3d7d9" stroke-width="2"/><text x="375" y="657">Level /</text><text x="375" y="683">high zones</text>
<path d="M598 659H670" stroke="#40d5f3" stroke-width="8" marker-end="url(#arrow)"/><text x="699" y="657">Direction of</text><text x="699" y="683">water flow</text>
<circle cx="916" cy="658" r="19" fill="#65747c" stroke="#e8cf94" stroke-width="4"/><circle cx="916" cy="658" r="10" fill="#1c252b"/><text x="945" y="656">Low point /</text><text x="945" y="682">outlet</text>
</g>
</svg>