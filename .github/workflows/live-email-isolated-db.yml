name: Isolated live email-queue two-connection tests

on:
  push:
    branches:
      - audit-20261121-stripe-receipts-critical
    paths:
      - 'tests/live-email-lease-concurrency.py'
      - 'tests/fixtures/live-email-*.sql'
      - '.github/workflows/live-email-isolated-db.yml'
  pull_request:
    paths:
      - 'tests/live-email-lease-concurrency.py'
      - 'tests/fixtures/live-email-*.sql'
      - '.github/workflows/live-email-isolated-db.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_review_only
          POSTGRES_DB: course_email_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d course_email_fixture"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:isolated_review_only@127.0.0.1:5432/course_email_fixture
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned driver
        run: python -m pip install 'psycopg[binary]==3.2.3'
      - name: Execute real two-connection claims on DISPOSABLE PostgreSQL ONLY
        run: python tests/live-email-lease-concurrency.py
