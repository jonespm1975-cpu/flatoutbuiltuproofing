name: Membership staged lifecycle source tests
on:
  push:
    branches: [main]
    paths:
      - "audits/membership-staged-source-2026-11-25/**"
      - "tests/membership-staged-source.cjs"
      - ".github/workflows/membership-staged-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TypeScript fixture transpiler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.7.3
      - name: Run staged membership source fixtures
        run: node tests/membership-staged-source.cjs
      - name: Scope
        run: echo "Mocked network, no deployment, Stripe charges, live database writes or emails."
