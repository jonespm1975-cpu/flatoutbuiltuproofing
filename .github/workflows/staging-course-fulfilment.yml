name: 24-course staging fulfilment tests
on:
  pull_request:
    branches: [main]
    paths:
      - "fulfilment/**"
      - ".github/workflows/staging-course-fulfilment.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout proposed branch (not production)
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run 24-course staging tests without network or secrets
        run: |
          node --test fulfilment/*.test.mjs
      - name: State test boundary
        run: |
          echo "Unit tests only. No real Stripe event, Supabase RPC, email, or payment tested."

  isolated-postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: course_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d course_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_POSTGRES_URL: postgresql://testuser:testpass@localhost:5432/course_ci
      PGPASSWORD: testpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database test driver
        run: python -m pip install "psycopg[binary]==3.2.3"
      - name: Create disposable schema only
        run: psql "$CI_POSTGRES_URL" -v ON_ERROR_STOP=1 -f fulfilment/ci-postgres-fixture.sql
      - name: Run real two-connection concurrency tests
        run: python fulfilment/test-postgres-concurrency.py
      - name: State isolation boundary
        run: echo "Disposable Postgres service only; no Supabase, Stripe, email or live data touched."
