
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Login | Flat Out Built-Up Roofing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
    }
    header {
      background: #050505;
      border-bottom: 2px solid #d4af37;
      padding: 22px 15px;
      text-align: center;
    }
    h1 { color: #d4af37; font-size: 24px; margin: 0; }
    .subtitle { color: #ccc; font-size: 14px; margin-top: 8px; }
    main {
      max-width: 420px;
      margin: 45px auto;
      padding: 25px;
      background: #202020;
      border: 1px solid #d4af37;
      border-radius: 14px;
    }
    h2 { text-align: center; color: #d4af37; }
    label { display: block; margin: 15px 0 6px; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #777;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .link {
      background: transparent;
      color: #d4af37;
      border: 1px solid #d4af37;
      margin-top: 10px;
    }
    #message { text-align: center; line-height: 1.5; }
    a { color: #d4af37; }
    footer { text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>FLAT OUT BUILT-UP ROOFING</h1>
    <p class="subtitle">Learn the Skills. Build the Knowledge.</p>
  </header>

  <main>
    <h2 id="heading">Customer Login</h2>

    <form id="authForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password"
             required>

      <button id="submitBtn" type="submit">Log In</button>
    </form>

    <button class="link" id="switchBtn" type="button">
      Create an Account
    </button>

    <button class="link" id="resetBtn" type="button">
      Forgotten Password?
    </button>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="members.html">Open My Learning</a></p>
    <button class="link" id="signOutBtn" type="button" hidden>Sign Out</button>
  </main>

  <footer>
    <a href="index.html">Back to Home</a>
  </footer>

  <script type="module">
    import { supabase, safeNext } from "./auth.js";
    const form = document.getElementById("authForm");
    const heading = document.getElementById("heading");
    const submitBtn = document.getElementById("submitBtn");
    const switchBtn = document.getElementById("switchBtn");
    const resetBtn = document.getElementById("resetBtn");
    const message = document.getElementById("message");
    const password = document.getElementById("password");
    const signOutBtn = document.getElementById("signOutBtn");
    const params = new URLSearchParams(location.search);
    let recoveryMode = false;
    async function refreshSession() {
      if (!supabase) return;
      const { data } = await supabase.auth.getUser();
      signOutBtn.hidden = !data?.user;
    }
    if (supabase) {
      supabase.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") {
          recoveryMode = true;
          signup = false;
          password.minLength = 12;
          password.autocomplete = "new-password";
          switchBtn.hidden = true;
          heading.textContent = "Set New Password";
          submitBtn.textContent = "Save New Password";
          notify("Enter a new password with at least 12 characters.");
        }
        setTimeout(() => refreshSession(), 0);
      });
      refreshSession();
    }
    signOutBtn.addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();
      notify(error ? "Could not sign out. Please try again." : "Signed out successfully.");
      refreshSession();
    });

    let signup = false;

    function notify(text) {
      message.textContent = text;
    }

    switchBtn.addEventListener("click", () => {
      if (recoveryMode) return;
      signup = !signup;
      password.minLength = signup ? 12 : 0;
      heading.textContent = signup ? "Create Account" : "Customer Login";
      submitBtn.textContent = signup ? "Create Account" : "Log In";
      switchBtn.textContent = signup
        ? "Already registered? Log In"
        : "Create an Account";
      password.autocomplete = signup
        ? "new-password" : "current-password";
      notify("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!supabase) {
        notify("Account registration is not connected yet.");
        return;
      }

      const email = document.getElementById("email").value.trim();
      const pass = password.value;

      submitBtn.disabled = true;

      try {
        if (recoveryMode) {
          const { error } = await supabase.auth.updateUser({ password: pass });
          if (error) throw error;
          recoveryMode = false;
          switchBtn.hidden = false;
          password.minLength = 0;
          password.autocomplete = "current-password";
          password.value = "";
          heading.textContent = "Customer Login";
          submitBtn.textContent = "Log In";
          location.replace("members.html");
        } else if (signup) {
          const { error } = await supabase.auth.signUp({
            email,
            password: pass,
            options: {
              emailRedirectTo:
                "https://flatoutbuiltuproofing.co.uk/login.html"
            }
          });
          if (error) throw error;
          notify("Check your email for a confirmation link.");
        } else {
          const { error } =
            await supabase.auth.signInWithPassword({
              email,
              password: pass
            });
          if (error) throw error;
          location.replace(safeNext(params.get("next")));
        }
      } catch (error) {
        notify(error.message || "Something went wrong.");
      } finally {
        submitBtn.disabled = false;
      }
    });

    resetBtn.addEventListener("click", async () => {
      const emailInput = document.getElementById("email");
      const email = emailInput.value.trim();
      if (!email || !emailInput.checkValidity()) {
        notify("Enter a valid email address first.");
        emailInput.focus();
        return;
      }
      resetBtn.disabled = true;
      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: "https://flatoutbuiltuproofing.co.uk/login.html"
        });
        // Do not reveal whether an address has an account.
        notify(error ? "Could not request a reset right now. Please try again later." :
          "If this account exists, check your email for reset instructions.");
      } catch {
        notify("Could not request a reset right now. Please try again later.");
      } finally {
        resetBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
