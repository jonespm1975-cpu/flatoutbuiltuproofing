
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Login | Flat Out Built-Up Roofing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
    }
    header {
      background: #050505;
      border-bottom: 2px solid #d4af37;
      padding: 22px 15px;
      text-align: center;
    }
    h1 { color: #d4af37; font-size: 24px; margin: 0; }
    .subtitle { color: #ccc; font-size: 14px; margin-top: 8px; }
    main {
      max-width: 420px;
      margin: 45px auto;
      padding: 25px;
      background: #202020;
      border: 1px solid #d4af37;
      border-radius: 14px;
    }
    h2 { text-align: center; color: #d4af37; }
    label { display: block; margin: 15px 0 6px; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #777;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .link {
      background: transparent;
      color: #d4af37;
      border: 1px solid #d4af37;
      margin-top: 10px;
    }
    #message { text-align: center; line-height: 1.5; }
    a { color: #d4af37; }
    footer { text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>FLAT OUT BUILT-UP ROOFING</h1>
    <p class="subtitle">Learn the Skills. Build the Knowledge.</p>
  </header>

  <main>
    <h2 id="heading">Customer Login</h2>

    <form id="authForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             minlength="12" autocomplete="current-password"
             required>

      <button id="submitBtn" type="submit">Log In</button>
    </form>

    <button class="link" id="switchBtn" type="button">
      Create an Account
    </button>

    <button class="link" id="resetBtn" type="button">
      Forgotten Password?
    </button>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <a href="index.html">Back to Home</a>
  </footer>

  <script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    

    // ADD YOUR PUBLIC SUPABASE DETAILS HERE LATER
   const SUPABASE_URL = "https://fhyhshakmvqwzdyannec.supabase.co";
    const SUPABASE_KEY = "sb_publishable_U5QORbnSzGR4j1_8hrmCGg_GOeQ5jwu";

    const configured =
      SUPABASE_URL.startsWith("https://") &&
      SUPABASE_KEY.startsWith("sb_publishable_");

    const supabase = configured
      ? createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    const form = document.getElementById("authForm");
    const heading = document.getElementById("heading");
    const submitBtn = document.getElementById("submitBtn");
    const switchBtn = document.getElementById("switchBtn");
    const resetBtn = document.getElementById("resetBtn");
    const message = document.getElementById("message");
    const password = document.getElementById("password");

    let signup = false;

    function notify(text) {
      message.textContent = text;
    }

    switchBtn.addEventListener("click", () => {
      signup = !signup;
      heading.textContent = signup ? "Create Account" : "Customer Login";
      submitBtn.textContent = signup ? "Create Account" : "Log In";
      switchBtn.textContent = signup
        ? "Already registered? Log In"
        : "Create an Account";
      password.autocomplete = signup
        ? "new-password" : "current-password";
      notify("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!supabase) {
        notify("Account registration is not connected yet.");
        return;
      }

      const email = document.getElementById("email").value.trim();
      const pass = password.value;

      submitBtn.disabled = true;

      try {
        if (signup) {
          const { error } = await supabase.auth.signUp({
            email,
            password: pass,
            options: {
              emailRedirectTo:
                "https://flatoutbuiltuproofing.co.uk/login.html"
            }
          });
          if (error) throw error;
          notify("Check your email for a confirmation link.");
        } else {
          const { error } =
            await supabase.auth.signInWithPassword({
              email,
              password: pass
            });
          if (error) throw error;
          notify("Signed in successfully. Course access is not ready yet.");
        }
      } catch (error) {
        notify(error.message || "Something went wrong.");
      } finally {
        submitBtn.disabled = false;
      }
    });

    resetBtn.addEventListener("click", async () => {
      if (!supabase) {
        notify("Password reset is not connected yet.");
        return;
      }

      const email = document.getElementById("email").value.trim();

      if (!email) {
        notify("Enter your email address first.");
        return;
      }

      const { error } = await supabase.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            "https://flatoutbuiltuproofing.co.uk/login.html"
        }
      );

      notify(error
        ? error.message
        : "If this account exists, check your email for reset instructions.");
    });
  </script>
</body>
</html>
